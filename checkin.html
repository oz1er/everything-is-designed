<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Event Check-in | IEEE CIS MJCET</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #171717;
            min-height: 100vh;
            padding: 25px 16px;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        header h2 {
            font-size: 20px;
        }

        .admin {
            background: #e0e7ff;
            color: #2f5bea;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 18px 10px;
            border-radius: 12px;
            text-align: center;
        }

        .stat h3 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .stat p {
            font-size: 11px;
            color: #777;
        }

        .scanner-card {
            background: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 4px 20px #00000008;
        }

        .scanner-card h3 {
            margin-bottom: 15px;
        }

        #reader {
            width: 100%;
            overflow: hidden;
            border-radius: 12px;
        }

        button {
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            font-size: 15px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .start {
            background: #2f5bea;
            color: white;
        }

        .stop {
            background: #eee;
            color: #171717;
        }

        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            background: #f1f5f9;
            display: none;
            overflow-wrap: anywhere;
            white-space: pre-line;
        }

        .result h3 {
            margin-bottom: 8px;
        }

        .manual {
            margin-top: 20px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 14px;
        }

        .manual button {
            background: #171717;
            color: white;
        }

        .note {
            color: #777;
            font-size: 12px;
            margin-top: 18px;
            text-align: center;
        }

        @media(max-width: 400px) {
            .stat h3 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h2>EVENT CHECK-IN</h2>
            <span class="admin">ORGANISER</span>
        </header>

        <section class="stats">

            <div class="stat">
                <h3>—</h3>
                <p>REGISTERED</p>
            </div>

            <div class="stat">
                <h3>—</h3>
                <p>CHECKED IN</p>
            </div>

            <div class="stat">
                <h3>—</h3>
                <p>PENDING</p>
            </div>

        </section>

        <section class="scanner-card">

            <h3>Scan Entry QR</h3>

            <div id="reader"></div>

            <button class="start" id="startBtn">
                Start Scanner
            </button>

            <button class="stop" id="stopBtn">
                Stop Scanner
            </button>

            <div class="result" id="result">

                <h3 id="resultTitle">QR Detected</h3>

                <p id="resultText"></p>

            </div>

            <div class="manual">

                <h3>Manual Token Entry</h3>

                <input type="text" id="manualToken" placeholder="Enter QR token" autocomplete="off">

                <button id="manualBtn">
                    Verify Registration
                </button>

            </div>

        </section>

        <p class="note">
            IEEE Computational Intelligence Society · MJCET
        </p>

    </div>

    <script>

        // ==========================================
        // CONFIGURATION
        // ==========================================

        const APPS_SCRIPT_URL =
            'https://script.google.com/macros/s/AKfycbys6l1jzrI4Jw5mWzuZXlaGlZ1bOYP0SQQnJniZxihazhOFZj-xRfF6dk9ZUg-5TquxNQ/exec'

        // ==========================================
        // SCANNER VARIABLES
        // ==========================================

        let scanner = null;
        let scanning = false;
        let processing = false;
        let organiserPin = '';

        const result = document.getElementById('result');
        const resultTitle = document.getElementById('resultTitle');
        const resultText = document.getElementById('resultText');

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const manualBtn = document.getElementById('manualBtn');


        // ==========================================
        // RESULT DISPLAY
        // ==========================================

        function showResult(title, message, status = '') {

            result.style.display = 'block';

            resultTitle.textContent = title;
            resultText.textContent = message;

            result.style.background =
                status === 'success' ? '#dcfce7' :
                    status === 'error' ? '#fee2e2' :
                        '#f1f5f9';
        }


        // ==========================================
        // PROCESS QR TOKEN
        // ==========================================

        function processToken(token) {

            token = token.trim();

            if (processing) return;

            // Validate QR token format
            if (!/^[a-f0-9]{64}$/i.test(token)) {

                showResult(
                    'INVALID QR',
                    'This QR code does not contain a valid registration token.',
                    'error'
                );

                return;
            }

            // Ask for organiser PIN
            if (!organiserPin) {

                organiserPin = prompt('Enter organiser PIN:') || '';

            }

            if (!organiserPin) {

                showResult(
                    'ACCESS REQUIRED',
                    'Organiser PIN is required.',
                    'error'
                );

                return;
            }

            verifyToken(token);

        }


        // ==========================================
        // CONNECT TO GOOGLE APPS SCRIPT
        // ==========================================

        function verifyToken(token) {

            processing = true;

            startBtn.disabled = true;
            manualBtn.disabled = true;

            showResult(
                'VERIFYING...',
                'Checking participant registration.'
            );

            // Remove previous API script
            const oldScript =
                document.getElementById('checkin-api');

            if (oldScript) oldScript.remove();

            const script = document.createElement('script');

            script.id = 'checkin-api';

            let completed = false;

            const timeout = setTimeout(function () {

                if (completed) return;

                completed = true;

                finishRequest();

                script.remove();

                showResult(
                    'CONNECTION ERROR',
                    'The server did not respond. Please try again.',
                    'error'
                );

            }, 15000);


            // Response callback
            window.handleCheckinResponse = function (data) {

                if (completed) return;

                completed = true;

                clearTimeout(timeout);

                finishRequest();

                // Incorrect PIN
                if (data.status === 'unauthorized') {

                    organiserPin = '';

                    showResult(
                        'ACCESS DENIED',
                        'Incorrect organiser PIN.',
                        'error'
                    );

                    return;
                }

                // Successful entry
                if (data.status === 'success') {

                    showResult(
                        'ENTRY SUCCESSFUL ✓',
                        'Participant: ' + data.name +
                        '\nRegistration ID: ' + data.registrationId +
                        '\nEntry time: ' +
                        new Date(data.entryTime).toLocaleTimeString(),
                        'success'
                    );

                    return;
                }

                // Duplicate entry
                if (data.status === 'already_checked_in') {

                    showResult(
                        'ALREADY CHECKED IN',
                        data.name + ' has already entered.',
                        'error'
                    );

                    return;
                }

                // Registration not found
                if (data.status === 'not_found') {

                    showResult(
                        'REGISTRATION NOT FOUND',
                        'This QR code does not belong to a registered participant.',
                        'error'
                    );

                    return;
                }

                // Invalid QR
                if (data.status === 'invalid_qr') {

                    showResult(
                        'INVALID QR',
                        'The QR token is invalid.',
                        'error'
                    );

                    return;
                }

                // Other errors
                showResult(
                    'SERVER ERROR',
                    'Something went wrong. Contact the administrator.',
                    'error'
                );

            };


            // Build request URL
            const params = new URLSearchParams({

                token: token,

                pin: organiserPin,

                callback: 'handleCheckinResponse'

            });

            script.src =
                APPS_SCRIPT_URL + '?' + params.toString();


            // Connection error
            script.onerror = function () {

                if (completed) return;

                completed = true;

                clearTimeout(timeout);

                finishRequest();

                showResult(
                    'CONNECTION ERROR',
                    'Could not connect to Google Apps Script.',
                    'error'
                );

            };

            document.body.appendChild(script);

        }


        // ==========================================
        // FINISH API REQUEST
        // ==========================================

        function finishRequest() {

            processing = false;

            startBtn.disabled = false;
            manualBtn.disabled = false;

        }


        // ==========================================
        // START CAMERA SCANNER
        // ==========================================

        startBtn.addEventListener('click', async function () {

            if (scanning || processing) return;

            try {

                if (!scanner) {

                    scanner = new Html5Qrcode('reader');

                }

                await scanner.start(

                    { facingMode: 'environment' },

                    {
                        fps: 10,
                        qrbox: {
                            width: 250,
                            height: 250
                        }
                    },

                    async function (decodedText) {

                        if (!scanning || processing) return;

                        scanning = false;

                        await scanner.stop();

                        processToken(decodedText);

                    },

                    function () { }

                );

                scanning = true;

                startBtn.disabled = true;
                stopBtn.disabled = false;

            } catch (error) {

                alert(
                    'Camera unavailable. Check camera permissions and HTTPS.'
                );

                console.error(error);

            }

        });


        // ==========================================
        // STOP CAMERA SCANNER
        // ==========================================

        stopBtn.addEventListener('click', async function () {

            if (scanner && scanning) {

                scanning = false;

                try {

                    await scanner.stop();

                } catch (error) {

                    console.error(error);

                }

                startBtn.disabled = false;

            }

        });


        // ==========================================
        // MANUAL TOKEN ENTRY
        // ==========================================

        manualBtn.addEventListener('click', function () {

            const token =
                document.getElementById('manualToken').value;

            processToken(token);

        });


        // Enter key support
        document.getElementById('manualToken')
            .addEventListener('keydown', function (event) {

                if (event.key === 'Enter') {

                    processToken(this.value);

                }

            });


    </script>

</body>

</html>
