<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Event Check-in | IEEE CIS MJCET</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #171717;
            min-height: 100vh;
            padding: 25px 16px;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        header h2 {
            font-size: 20px;
        }

        .admin {
            background: #e0e7ff;
            color: #2f5bea;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 18px 10px;
            border-radius: 12px;
            text-align: center;
        }

        .stat h3 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .stat p {
            font-size: 11px;
            color: #777;
        }

        .scanner-card {
            background: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 4px 20px #00000008;
        }

        .scanner-card h3 {
            margin-bottom: 15px;
        }

        #reader {
            width: 100%;
            overflow: hidden;
            border-radius: 12px;
        }

        button {
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            font-size: 15px;
        }

        .start {
            background: #2f5bea;
            color: white;
        }

        .stop {
            background: #eee;
            color: #171717;
        }

        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            background: #f1f5f9;
            display: none;
            overflow-wrap: anywhere;
        }

        .result h3 {
            margin-bottom: 8px;
        }

        .manual {
            margin-top: 20px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 14px;
        }

        .manual button {
            background: #171717;
            color: white;
        }

        .note {
            color: #777;
            font-size: 12px;
            margin-top: 18px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h2>EVENT CHECK-IN</h2>
            <span class="admin">ORGANISER</span>
        </header>

        <section class="stats">
            <div class="stat">
                <h3>—</h3>
                <p>REGISTERED</p>
            </div>

            <div class="stat">
                <h3>—</h3>
                <p>CHECKED IN</p>
            </div>

            <div class="stat">
                <h3>—</h3>
                <p>PENDING</p>
            </div>
        </section>

        <section class="scanner-card">

            <h3>Scan Entry QR</h3>

            <div id="reader"></div>

            <button class="start" id="startBtn">
                Start Scanner
            </button>

            <button class="stop" id="stopBtn">
                Stop Scanner
            </button>

            <div class="result" id="result">
                <h3 id="resultTitle">QR Detected</h3>
                <p id="resultText"></p>
            </div>

            <div class="manual">
                <h3>Manual Token Entry</h3>

                <input type="text" id="manualToken" placeholder="Enter QR token">

                <button onclick="processToken(
        document.getElementById('manualToken').value
      )">
                    Read Token
                </button>
            </div>

        </section>

        <p class="note">
            IEEE Computational Intelligence Society · MJCET
        </p>

    </div>

    <script>

        let scanner = null;
        let scanning = false;

        const result = document.getElementById('result');
        const resultTitle = document.getElementById('resultTitle');
        const resultText = document.getElementById('resultText');

        function processToken(token) {

            token = token.trim();

            if (!token) {
                alert('Please enter a valid token.');
                return;
            }

            if (!/^[a-f0-9]{64}$/i.test(token)) {
                showResult(
                    'INVALID QR FORMAT',
                    'This QR code does not contain a valid registration token.'
                );
                return;
            }

            showResult(
                'QR DETECTED',
                'Token captured successfully. Server verification will be connected in Step 4.'
            );

            console.log('Scanned token:', token);

            document.getElementById('manualToken').value = token;
        }

        function showResult(title, message) {
            result.style.display = 'block';
            resultTitle.textContent = title;
            resultText.textContent = message;
        }

        document.getElementById('startBtn').addEventListener(
            'click',
            async function () {

                if (scanning) return;

                try {

                    if (!scanner) {
                        scanner = new Html5Qrcode('reader');
                    }

                    await scanner.start(
                        { facingMode: 'environment' },
                        {
                            fps: 10,
                            qrbox: { width: 250, height: 250 }
                        },
                        function (decodedText) {

                            if (!scanning) return;

                            scanning = false;

                            processToken(decodedText);

                            scanner.stop().catch(console.error);

                        },
                        function () { }
                    );

                    scanning = true;

                } catch (error) {
                    alert('Camera unavailable. Allow camera permissions and try again.');
                    console.error(error);
                }
            }
        );

        document.getElementById('stopBtn').addEventListener(
            'click',
            async function () {

                if (scanner && scanning) {
                    scanning = false;
                    await scanner.stop();
                }

            }
        );

    </script>

</body>

</html>
