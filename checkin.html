<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Event Check-in | IEEE CIS MJCET</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --cream: #FBF6E9; --ink: #171717; --blue: #2F5BEA; --pink: #FF4FA3;
            --green: #1FA85A; --sun: #FFC93C; --card: #fff; --muted: #5b574d; --red: #E5484D
        }
        @media(prefers-color-scheme:dark) {
            :root { --cream: #16140f; --ink: #f6f0e0; --card: #24211a; --muted: #b9b3a3 }
        }
        * { box-sizing: border-box; margin: 0; padding: 0 }
        body {
            font-family: 'Bricolage Grotesque', system-ui, sans-serif;
            font-weight: 500; line-height: 1.5;
            background: var(--cream); color: var(--ink);
            min-height: 100vh; padding: 28px 16px
        }
        .mono { font-family: 'Space Mono', ui-monospace, monospace }
        :focus-visible { outline: 3px solid var(--pink); outline-offset: 3px }
        .container { max-width: 520px; margin: auto }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; gap: 12px }
        header h2 { font-weight: 800; font-size: 1.9rem; letter-spacing: -.03em; line-height: 1 }
        .admin {
            background: var(--green); color: #fff; padding: 6px 14px;
            font-family: 'Space Mono', monospace; font-size: .8rem; font-weight: 700;
            letter-spacing: .04em; transform: rotate(-2deg); display: inline-block
        }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px }
        .stat {
            background: var(--card); padding: 18px 10px; border-radius: 20px;
            text-align: center; box-shadow: 5px 5px 0 rgba(0, 0, 0, .1)
        }
        .stat:nth-child(1) h3 { color: var(--blue) }
        .stat:nth-child(2) h3 { color: var(--green) }
        .stat:nth-child(3) h3 { color: var(--pink) }
        .stat h3 { font-weight: 800; font-size: 2rem; letter-spacing: -.03em; line-height: 1.1; margin-bottom: 4px }
        .stat p { font-family: 'Space Mono', monospace; font-size: .68rem; letter-spacing: .1em; color: var(--muted) }
        .scanner-card {
            background: var(--card); padding: 32px 28px; border-radius: 28px;
            box-shadow: 8px 8px 0 rgba(0, 0, 0, .1)
        }
        .scanner-card h3 { font-weight: 800; font-size: 1.15rem; margin-bottom: 14px }
        #reader { width: 100%; overflow: hidden; border-radius: 16px }
        button {
            border: none; padding: 15px; border-radius: 999px; font-family: inherit;
            font-weight: 800; font-size: 1rem; cursor: pointer; width: 100%; margin-top: 14px;
            transition: transform .15s, box-shadow .15s
        }
        button:disabled { opacity: .5; cursor: not-allowed }
        button:not(:disabled):hover { transform: translate(-2px, -2px) }
        button:not(:disabled):active { transform: translate(2px, 2px) }
        .start { background: var(--ink); color: var(--cream); box-shadow: 5px 5px 0 var(--blue) }
        .start:not(:disabled):hover { box-shadow: 7px 7px 0 var(--blue) }
        .stop { background: var(--cream); color: var(--ink); border: 2px solid rgba(0, 0, 0, .12) }
        .result {
            margin-top: 20px; padding: 18px 20px; border-radius: 20px;
            background: var(--cream); display: none; overflow-wrap: anywhere; white-space: pre-line
        }
        .result.success { background: var(--green); color: #fff }
        .result.error { background: var(--red); color: #fff }
        .result h3 { margin-bottom: 8px; font-weight: 800 }
        .manual { margin-top: 28px; padding-top: 22px; border-top: 1px dashed rgba(0, 0, 0, .15) }
        input {
            width: 100%; padding: 14px 18px; border: 2px solid rgba(0, 0, 0, .12); border-radius: 14px;
            margin-top: 10px; font-family: inherit; font-size: 1rem; font-weight: 500;
            background: var(--cream); color: var(--ink); outline: none;
            transition: border-color .15s, box-shadow .15s
        }
        input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(47, 91, 234, .12) }
        .manual button { background: var(--blue); color: #fff; box-shadow: 5px 5px 0 rgba(0, 0, 0, .18) }
        .note { color: var(--muted); font-family: 'Space Mono', monospace; font-size: .72rem; margin-top: 22px; text-align: center }
        @media(max-width: 400px) { .stat h3 { font-size: 1.6rem } .scanner-card { padding: 24px 18px } }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h2>EVENT CHECK-IN</h2>
            <span class="admin">ORGANISER</span>
        </header>

        <section class="stats">

            <div class="stat">
                <h3>—</h3>
                <p>REGISTERED</p>
            </div>

            <div class="stat">
                <h3>—</h3>
                <p>CHECKED IN</p>
            </div>

            <div class="stat">
                <h3>—</h3>
                <p>PENDING</p>
            </div>

        </section>

        <section class="scanner-card">

            <h3>Scan Entry QR</h3>

            <div id="reader"></div>

            <button class="start" id="startBtn">
                Start Scanner
            </button>

            <button class="stop" id="stopBtn">
                Stop Scanner
            </button>

            <div class="result" id="result">

                <h3 id="resultTitle">QR Detected</h3>

                <p id="resultText"></p>

            </div>

            <div class="manual">

                <h3>Manual Token Entry</h3>

                <input type="text" id="manualToken" placeholder="Enter QR token" autocomplete="off">

                <button id="manualBtn">
                    Verify Registration
                </button>

            </div>

        </section>

        <p class="note">
            IEEE Computational Intelligence Society · MJCET
        </p>

    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbys6l1jzrI4Jw5mWzuZXlaGlZ1bOYP0SQQnJniZxihazhOFZj-xRfF6dk9ZUg-5TquxNQ/exec';
        let scanner = null;
        let scanning = false;
        let processing = false;
        let organiserPin = '';
        let autoResume = true;
        let statsTimer = null;

        const result = document.getElementById('result');
        const resultTitle = document.getElementById('resultTitle');
        const resultText = document.getElementById('resultText');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const manualBtn = document.getElementById('manualBtn');
        const statValues = document.querySelectorAll('.stats .stat h3');

        function showResult(title, message, status = '') {
            result.style.display = 'block';
            resultTitle.textContent = title;
            resultText.textContent = message;
            result.className = 'result ' + status;
            result.style.display = 'block';
        }

        function ensurePin() {
            if (organiserPin) return true;
            organiserPin = (prompt('Enter organiser PIN:') || '').trim();
            return !!organiserPin;
        }

        function jsonpRequest(params, onSuccess, onFailure) {
            const callbackName = 'eventApiCallback_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
            const script = document.createElement('script');
            let finished = false;
            const cleanup = () => {
                if (finished) return;
                finished = true;
                clearTimeout(timeout);
                delete window[callbackName];
                script.remove();
            };
            const timeout = setTimeout(() => {
                cleanup();
                onFailure(new Error('Request timed out'));
            }, 15000);

            window[callbackName] = data => {
                if (finished) return;
                cleanup();
                onSuccess(data);
            };
            const query = new URLSearchParams({ ...params, callback: callbackName });
            script.src = APPS_SCRIPT_URL + '?' + query.toString();
            script.onerror = () => {
                if (finished) return;
                cleanup();
                onFailure(new Error('Could not load Apps Script response'));
            };
            document.body.appendChild(script);
        }

        function loadStats() {
            if (!ensurePin()) return;
            jsonpRequest({ action: 'stats', pin: organiserPin }, data => {
                if (data.status === 'unauthorized') {
                    organiserPin = '';
                    if (statsTimer) clearInterval(statsTimer);
                    showResult('ACCESS DENIED', 'Enter the correct organiser PIN to load dashboard statistics.', 'error');
                    return;
                }
                if (!data.ok) return;
                statValues[0].textContent = data.registered;
                statValues[1].textContent = data.checkedIn;
                statValues[2].textContent = data.pending;
            }, () => {
                // Keep the dashboard usable if a background stats refresh fails.
            });
        }

        function finishRequest() {
            processing = false;
            startBtn.disabled = false;
            manualBtn.disabled = false;
            if (autoResume) setTimeout(startScanner, 1600);
        }

        function handleCheckinResult(data) {
            if (data.status === 'unauthorized') {
                organiserPin = '';
                autoResume = false;
                showResult('ACCESS DENIED', 'Incorrect organiser PIN. Start scanning again and re-enter it.', 'error');
                return;
            }
            if (data.status === 'success') {
                showResult('ENTRY SUCCESSFUL ✓', 'Participant: ' + data.name +
                    '\nRegistration ID: ' + data.registrationId +
                    '\nEntry time: ' + new Date(data.entryTime).toLocaleTimeString(), 'success');
                loadStats();
                return;
            }
            if (data.status === 'already_checked_in') {
                showResult('ALREADY CHECKED IN', data.name + ' has already entered.', 'error');
                loadStats();
                return;
            }
            if (data.status === 'not_paid') {
                showResult('PAYMENT NOT VERIFIED', (data.name || 'This participant') + ' is not cleared for entry yet.', 'error');
                return;
            }
            if (data.status === 'not_found') {
                showResult('REGISTRATION NOT FOUND', 'This QR code does not belong to a registered participant.', 'error');
                return;
            }
            if (data.status === 'invalid_qr') {
                showResult('INVALID QR', 'The QR token is invalid.', 'error');
                return;
            }
            showResult('SERVER ERROR', 'Something went wrong. Contact the administrator.', 'error');
        }

        function verifyToken(token) {
            processing = true;
            startBtn.disabled = true;
            manualBtn.disabled = true;
            showResult('VERIFYING...', 'Checking participant registration.');
            jsonpRequest({ token: token, pin: organiserPin }, data => {
                handleCheckinResult(data);
                finishRequest();
            }, () => {
                showResult('CONNECTION ERROR', 'Could not connect to Google Apps Script. Check deployment and internet connection.', 'error');
                finishRequest();
            });
        }

        function processToken(rawToken) {
            const token = String(rawToken || '').trim();
            if (processing) return;
            if (!/^[a-f0-9]{64}$/i.test(token)) {
                showResult('INVALID QR', 'This QR code does not contain a valid registration token.', 'error');
                return;
            }
            if (!ensurePin()) {
                autoResume = false;
                showResult('ACCESS REQUIRED', 'Organiser PIN is required.', 'error');
                return;
            }
            autoResume = true;
            verifyToken(token);
        }

        async function startScanner() {
            if (scanning || processing) return;
            try {
                if (!scanner) scanner = new Html5Qrcode('reader');
                await scanner.start(
                    { facingMode: 'environment' },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    async decodedText => {
                        if (!scanning || processing) return;
                        scanning = false;
                        try { await scanner.stop(); } catch (err) { console.error(err); }
                        processToken(decodedText);
                    },
                    () => { }
                );
                scanning = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
            } catch (error) {
                scanning = false;
                startBtn.disabled = false;
                alert('Camera unavailable. Check camera permissions and HTTPS.');
                console.error(error);
            }
        }

        startBtn.addEventListener('click', () => {
            autoResume = true;
            startScanner();
        });

        stopBtn.addEventListener('click', async () => {
            autoResume = false;
            if (scanner && scanning) {
                scanning = false;
                try { await scanner.stop(); } catch (error) { console.error(error); }
            }
            startBtn.disabled = false;
        });

        manualBtn.addEventListener('click', () => {
            autoResume = false;
            processToken(document.getElementById('manualToken').value);
            autoResume = false;
        });

        document.getElementById('manualToken').addEventListener('keydown', event => {
            if (event.key === 'Enter') {
                autoResume = false;
                processToken(event.currentTarget.value);
                autoResume = false;
            }
        });

        // Load protected aggregate statistics and refresh them periodically.
        loadStats();
        statsTimer = setInterval(loadStats, 20000);
    </script>

</body>

</html>
